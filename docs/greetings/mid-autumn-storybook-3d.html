*{box-sizing:border-box;margin:0;padding:0}

const HEAD = [

let curHead = -1, curCap = -1;
const seg = (list, t) => list.findIndex(x => t >= x[0] && t < x[1]);
const fadeOf = (x, t) => P(t, x[0], x[0] + .45) * (1 - P(t, x[1] - .4, x[1]));

/* ================= 每幀更新 ================= */
const STORIES = [A, Bs, C];
function updatePieces(S, t){
  const vis = t >= S.rise - .05 && t < S.fold + .9; S.root.visible = vis; if (!vis) return;
  S.pieces.forEach(pc => {
    const r0 = pc.riseAt != null ? pc.riseAt : S.rise + pc.i*.2;
    const e = ebk(P(t, r0, r0 + 1.1)) * (1 - eio(P(t, S.fold, S.fold + .75)));
    pc.g.rotation.x = -(Math.PI/2)*(1 - e);
    pc.g.scale.setScalar(.15 + .85*clamp(e, 0, 1));
    pc.g.visible = e > .003;
  });
}
const tmp = V(0, 0, 0);
function storyA(t){
  SUNS.forEach((s, i) => {
    let sc = s.s*(1 + .06*Math.sin(t*6 + s.ph)), op = 1;
    s.g.position.copy(s.base);
    if (s.shot){
      const hit = s.shot.t + .45, f = P(t, hit, hit + 1.3);
      if (t >= hit) sc *= 1 + .35*(1 - P(t, hit, hit + .3));
      s.g.position.x += f*.3; s.g.position.y -= eio(f)*4.2; s.g.rotation.z = f*3;
      op = 1 - P(t, hit + .5, hit + 1.3);
    }
    s.g.scale.setScalar(sc); s.body.material.opacity = op; s.rm.opacity = op; s.gl.material.opacity = .85*op;
    s.g.visible = op > .01; s.rays.rotation.z = t*.45 + s.ph;
  });
  aHot.material.opacity = 1 - P(t, 27.6, 29.2);
  const lush = P(t, 28, 29.8);
  duneMat.color.lerpColors(new THREE.Color('#c08a52'), new THREE.Color('#79b060'), lush);
  stalkMat.color.lerpColors(new THREE.Color('#8a5a2b'), new THREE.Color('#3f7d3a'), lush);
  headMat.color.lerpColors(new THREE.Color('#9a6a3a'), new THREE.Color('#f0b93a'), lush);
  crops.forEach((c, i) => { c.rotation.z = lerp(.6, 0, lush) * (i % 2 ? 1 : -1) + Math.sin(t*2 + i)*.05*lush; });
  const joy = P(t, 28.2, 28.9);
  VILS.forEach((h, i) => {
    h.head.rotation.x = .38*(1 - joy);
    const up = joy, bounce = Math.abs(Math.sin(t*5 + i))*.14*joy;
    h.g.position.y = bounce;
    h.setArms(V(lerp(.38, .5, up), lerp(.58, 1.75, up), lerp(.1, .15, up)), V(lerp(-.38, -.5, up), lerp(.58, 1.75, up), lerp(.1, .15, up)));
  });
  // 拉弓
  const ready = eio(P(t, 18.6, 19.4)) * (1 - P(t, 28.3, 28.9));
  let pull = eio(P(t, 19.3, 20.7)), snap = 1;
  ARROWS.forEach(a => { const d = t - a.t; if (d >= 0 && d < .42) snap = Math.min(snap, d < .06 ? 0 : eio((d - .06)/.36)); });
  pull *= snap*(1 - P(t, 27.9, 28.4));
  const sPt = SMID.clone().lerp(DRAW, pull);
  limb(str1, TIP1, sPt, .01); limb(str2, sPt, TIP2, .01);
  const restR = V(-.42, .62, .1);
  HY.setArms(GRIP, restR.clone().lerp(ready > .5 ? sPt : SMID, ready));
  nock.visible = pull > .25 && t < 28;
  nock.position.copy(sPt).addScaledVector(AIM, .45); nock.quaternion.setFromUnitVectors(Y, AIM);
  // 飛箭
  scene.updateMatrixWorld();
  const start = A.root.worldToLocal(HY.g.localToWorld(GRIP.clone()));
  ARROWS.forEach(a => {
    const u = P(t, a.t, a.t + .45); a.m.visible = t >= a.t && t <= a.t + .45;
    if (!a.m.visible) return;
    const s = SUNS[a.sun], end = A.root.worldToLocal(s.g.parent.localToWorld(s.base.clone()));
    a.m.position.copy(start).lerp(end, u); a.m.quaternion.setFromUnitVectors(Y, tmp.subVectors(end, start).normalize());
  });
  const e = P(t, 28.4, 29.4);
  elixir.visible = e > 0; elixir.scale.setScalar(.2 + .8*eout(e)); elixir.position.y = 3.4 + Math.sin(t*2)*.1; elixir.rotation.y = t*1.2;
}
function storyB(t){
  moonGlow.material.opacity = .7 + .1*Math.sin(t*1.6);
  bHouse.lanterns.forEach((l, i) => l.rotation.z = Math.sin(t*1.8 + i)*.12);
  const a = eio(P(t, 46.4, 50.6));
  const p0 = V(0, 0, 0), p1 = V(1.4, 3.8, -.6), p2 = V(2.2, 3.35, -2.05);
  const q = p0.clone().multiplyScalar((1 - a)*(1 - a)).add(p1.clone().multiplyScalar(2*a*(1 - a))).add(p2.clone().multiplyScalar(a*a));
  CE.g.position.copy(q); CE.g.position.y += Math.sin(t*2)*.05*(.3 + a);
  CE.g.scale.setScalar(1.2*lerp(1, .5, a)); CE.g.rotation.z = Math.sin(t*1.5)*.05 - a*(1 - a)*.8;
  ribbon.rotation.y = Math.sin(t*2.2)*.25; ribbon.rotation.x = -a*(1 - a)*1.2;
  const fly = P(t, 46.4, 47.2);
  CE.setArms(V(lerp(.4, .72, fly), lerp(.62, 1.05, fly), lerp(.12, -.05, fly)), V(lerp(-.2, -.72, fly), lerp(.95, 1.05, fly), lerp(.3, -.05, fly)));
  const sw = P(t, 45.8, 46.3);
  pill.visible = t < 46.4; pill.position.copy(V(-.2, .98, .38).lerp(V(0, 1.35, .35), sw)); pill.scale.setScalar(1 - .8*sw);
  const inn = ebk(P(t, 41.1, 41.9)), out = eio(P(t, 46.8, 47.6));
  FM.g.scale.setScalar(Math.max(.001, 1.3*inn*(1 - out))); FM.g.visible = t > 41.1 && out < 1;
  FM.g.position.x = lerp(.9, 0, eout(P(t, 41.1, 42.8))) + out*1.5;
  FM.g.position.y = Math.abs(Math.sin(t*6))*.06*P(t, 41.1, 42.8)*(1 - P(t, 42.8, 43));
  FM.setArms(V(.45, 1.65, .2), V(-.5, 1.0, .5));
  sword.position.set(.45, 1.65, .2); sword.rotation.set(-.3 + Math.sin(t*3)*.15, 0, -.3);
  const rb = ebk(P(t, 51.3, 52.1));
  bRabbit.visible = rb > .01; bRabbit.scale.setScalar(.55*Math.max(rb, .01));
  bRabbit.position.y = 2.72 + Math.abs(Math.sin(t*3.2))*.14*P(t, 52, 52.5);
  smoke.forEach((s, i) => { const k = ((t*.35 + i/3) % 1); s.position.set(.82 + Math.sin(t + i)*.06, .9 + k*1.0, -.25); s.material.opacity = .45*(1 - k); s.scale.setScalar(.25 + k*.4); });
}
function storyC(t){
  earth.rotation.y = t*.3;
  const show = ebk(P(t, 69, 69.8));
  WG.g.visible = t > 69; WG.g.scale.setScalar(1.25*Math.max(show, .001));
  const start = 69.8, per = 1.6; let ang = .55, dtHit = 99;
  if (t >= start){
    const u = ((t - start) % per)/per;
    if (u < .55) ang = lerp(.55, -1.9, eio(u/.55));
    else if (u < .7) ang = lerp(-1.9, .6, ein((u - .55)/.15));
    else ang = lerp(.6, .55, eout((u - .7)/.3));
    const n = Math.floor((t - start - .7*per)/per);
    if (t >= start + .7*per) dtHit = t - (start + n*per + .7*per);
  }
  axe.rotation.x = ang;
  const h1 = V(0, 0, .3).applyQuaternion(axe.quaternion).add(axe.position), h2 = V(0, 0, .6).applyQuaternion(axe.quaternion).add(axe.position);
  WG.setArms(h2, h1);
  WG.g.rotation.z = Math.sin(ang)*.04;
  notchMat.opacity = dtHit < .15 ? 1 : 1 - P(dtHit, .3, 1.1);
  healM.opacity = dtHit < 1.2 ? Math.sin(Math.PI*P(dtHit, .3, 1.1)) : 0;
  heals.forEach((h, i) => h.position.y = .35 + i*.08 + P(dtHit, .3, 1.1)*.25);
  chips.forEach((c, i) => {
    c.visible = dtHit < .55;
    c.position.set(.44 + (.6 + i*.25)*dtHit, .45 + (1.4 - i*.2)*dtHit - 3*dtHit*dtHit, .28 + (i - 1)*.3*dtHit);
    c.rotation.set(dtHit*9, dtHit*7, 0);
  });
  petalData.forEach((p, i) => {
    const k = ((t*p.sp*.25 + p.off) % 1);
    dmy.position.set(p.x + Math.sin(t*1.3 + p.ph)*.25, 3.4 - k*3.4, p.z); dmy.rotation.set(t + p.ph, t*.7, 0);
    dmy.scale.setScalar(k > .92 ? (1 - k)/.08 : 1); dmy.updateMatrix(); petals.setMatrixAt(i, dmy.matrix);
  });
  petals.instanceMatrix.needsUpdate = true;
  pestle.position.y = .75 + Math.abs(Math.sin(t*3.4))*.2;
}
function render(t){
  stageStars.forEach(s => s.el.style.opacity = (.25 + .6*Math.abs(Math.sin(t*s.sp*.6 + s.ph))).toFixed(2));
  // 書本姿態
  const o = eio(P(t, 5, 7)), c = eio(P(t, 90.2, 92.4)), intro = eout(P(t, 0, 1.6));
  const closedX = -(PW + OV)/2;
  book.position.set(lerp(lerp(closedX, 0, o), closedX, c), lerp(-6, 0, intro) + lerp(2.4, 0, o) + lerp(0, 2.4, c) + Math.sin(t*.9)*.05, lerp(1.2, 0, o) + lerp(0, 1.2, c));
  book.rotation.x = lerp(lerp(1.05, 0, o), 1.05, c);
  coverPivot.rotation.z = t < 90 ? Math.PI*o : Math.PI*(1 - c);
  [[leaf1, 34, 35.4], [leaf2, 62, 63.4]].forEach(L => { L[0].visible = t >= L[1] && t < 90; L[0].rotation.z = Math.PI*eio(P(t, L[1], L[2])); });
  STORIES.forEach(S => updatePieces(S, t));
  if (A.root.visible) storyA(t);
  if (Bs.root.visible) storyB(t);
  if (C.root.visible) storyC(t);
  camera.position.set(CAM.x + Math.sin(t*.15)*.5, CAM.y, CAM.z);
  camera.lookAt(LOOK);
  renderer.render(scene, camera);
  // 畫面桂花
  const pe = P(t, 84, 85.5)*(1 - P(t, 99.4, 100));
  petals2d.forEach(p => {
    if (pe <= 0){ p.el.style.opacity = 0; return; }
    const y = ((t*p.sp + p.off) % 2000) - 40, x = p.x0 + Math.sin(t*.9 + p.ph)*p.amp;
    p.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px) rotate(${((t*60 + p.ph*57) % 360).toFixed(0)}deg) scale(${p.sc.toFixed(2)})`;
    p.el.style.opacity = (pe*.9).toFixed(2);
  });
  const h = seg(HEAD, t);
  if (h !== curHead){ curHead = h; $('kicker').textContent = h >= 0 ? HEAD[h][2] : ''; $('title').textContent = h >= 0 ? HEAD[h][3] : ''; }
  $('head').style.opacity = h >= 0 ? fadeOf(HEAD[h], t).toFixed(3) : 0;
  const ci = seg(CAPS, t);
  if (ci !== curCap){ curCap = ci; $('capT').innerHTML = ci >= 0 ? CAPS[ci][2] : ''; }
  $('capT').style.opacity = ci >= 0 ? fadeOf(CAPS[ci], t).toFixed(3) : 0;
  $('cap').style.opacity = P(t, .9, 1.5).toFixed(3);
}

function fit(){ const s = Math.min(innerWidth/1080, innerHeight/1920); $('stage').style.setProperty('--s', s.toFixed(4)); }
addEventListener('resize', fit); fit();
if (location.search.includes('capture')){
  document.documentElement.classList.add('capture');
  window.__seek = t => { render(t); return 1; };
  render(0);
} else {
  let start = performance.now(), paused = false, cur = 0;
  const seek = $('seek');
  const jump = t => { start = performance.now() - t*1000; cur = t; render(t); };
  const loop = now => {
    if (!paused){ cur = (now - start)/1000; if (cur > D + 2) jump(0); render(Math.min(cur, D)); seek.value = Math.min(cur, D).toFixed(1); }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
  $('bPlay').onclick = function(){ paused = !paused; this.textContent = paused ? '播放' : '暫停'; if (!paused) jump(cur); };
  document.querySelectorAll('.ui [data-t]').forEach(b => b.onclick = () => jump(parseFloat(b.dataset.t)));
  seek.oninput = () => jump(parseFloat(seek.value));
}
