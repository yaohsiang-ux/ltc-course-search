<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>燿翔 中秋節慶賀 — 對外社群版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky-top:#070f26; --sky-mid:#132449; --sky-low:#2b2a52; --horizon:#5a3a4e;
  --gold:#f6c96b; --gold-2:#ffe6a6; --moon:#fff3cf; --ink:#fff8e7; --lantern:#e4573a;
  --serif:'Noto Serif TC','WenQuanYi Zen Hei','PingFang TC','Microsoft JhengHei',serif;
  --sans:'Noto Sans TC','WenQuanYi Zen Hei','PingFang TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05091a;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:var(--sans);color:var(--ink)}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden;flex:none;
  transform-origin:center center;transform:scale(var(--s,1));
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 45%,var(--sky-low) 72%,var(--horizon) 100%)}

/* ---------- 星星 ---------- */
.star{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.6;
  animation:twinkle 3.2s ease-in-out infinite}
.star.s{width:4px;height:4px}.star.l{width:8px;height:8px}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.95;transform:scale(1.15)}}

/* ---------- 月亮 ---------- */
.moon-wrap{position:absolute;left:50%;top:330px;width:460px;height:460px;margin-left:-230px;
  animation:moonrise 5.2s cubic-bezier(.22,.75,.3,1) 0s both}
@keyframes moonrise{0%{transform:translateY(720px) scale(.86);opacity:0}25%{opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
.moon{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#fffbea 0%,var(--moon) 45%,#f2dc9c 100%);
  box-shadow:0 0 40px 10px rgba(255,236,170,.45)}
.halo{position:absolute;left:50%;top:50%;width:1500px;height:1500px;margin:-750px 0 0 -750px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,236,170,.55) 0%,rgba(255,224,150,.28) 14%,rgba(255,214,130,.12) 28%,rgba(255,210,120,0) 48%);
  animation:glow 4.5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.06)}}
.crater{position:absolute;border-radius:50%;background:rgba(214,186,120,.35)}
.moon-wrap svg.rabbit{position:absolute;left:50%;top:50%;width:250px;height:250px;margin:-118px 0 0 -128px;opacity:.28}

/* ---------- 雲 ---------- */
.cloud{position:absolute;height:90px;border-radius:999px;background:rgba(255,255,255,.08);filter:blur(14px)}
.cloud.a{width:560px;top:520px;left:-200px;animation:drift 34s linear infinite}
.cloud.b{width:420px;top:700px;left:600px;animation:drift 42s linear -12s infinite}
.cloud.c{width:700px;top:250px;left:300px;animation:drift 50s linear -25s infinite;opacity:.7}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1400px)}}

/* ---------- 燈籠 ---------- */
.lantern{position:absolute;width:110px;height:170px;animation:floatup 19s linear infinite both;will-change:transform}
.lantern svg{width:100%;height:100%;overflow:visible}
.lantern .sway{transform-origin:50% 0;animation:sway 3.4s ease-in-out infinite}
@keyframes floatup{0%{transform:translateY(2100px)}100%{transform:translateY(-500px)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}

/* ---------- 桂花 ---------- */
.petal{position:absolute;top:-60px;width:26px;height:26px;animation:fall linear infinite}
.petal svg{width:100%;height:100%;animation:spin 3s linear infinite}
@keyframes fall{0%{transform:translate(0,-60px);opacity:0}8%{opacity:.9}88%{opacity:.9}100%{transform:translate(90px,2000px);opacity:0}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ---------- 地景 ---------- */
.land{position:absolute;left:0;right:0;bottom:0;height:520px}
.land svg{width:100%;height:100%;display:block}
.window{animation:winkwin 2.6s ease-in-out infinite}
@keyframes winkwin{0%,100%{opacity:.85}50%{opacity:1}}

/* ---------- 文字場景 ---------- */
.scene{position:absolute;left:0;right:0;text-align:center;padding:0 80px;
  animation:fadeout .8s ease-in var(--out) forwards}
.scene>*{animation:fadeup .95s cubic-bezier(.2,.7,.2,1) var(--in) both}
.scene>*:nth-child(2){animation-delay:calc(var(--in) + .35s)}
.scene>*:nth-child(3){animation-delay:calc(var(--in) + .7s)}
.scene>*:nth-child(4){animation-delay:calc(var(--in) + 1.05s)}
@keyframes fadeup{from{opacity:0;transform:translateY(46px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeout{from{opacity:1}to{opacity:0}}

.h-title{font-family:var(--serif);font-weight:900;font-size:150px;line-height:1.1;letter-spacing:.08em;white-space:nowrap;color:var(--gold-2);
  text-shadow:0 6px 30px rgba(0,0,0,.45),0 0 40px rgba(255,214,120,.35)}
.h-org{font-size:50px;font-weight:500;letter-spacing:.18em;color:var(--ink);opacity:.95;margin-top:44px}
.rule{width:220px;height:3px;margin:34px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

.big{font-family:var(--serif);font-weight:900;font-size:118px;line-height:1.25;letter-spacing:.06em;white-space:nowrap;color:var(--gold-2);
  text-shadow:0 6px 30px rgba(0,0,0,.45)}
.sub{font-size:70px;line-height:1.55;font-weight:500;letter-spacing:.08em;margin-top:44px;text-shadow:0 4px 20px rgba(0,0,0,.4)}

.card{margin:0 auto;max-width:900px;padding:60px 56px 64px;border-radius:44px;
  background:rgba(12,20,50,.55);border:2px solid rgba(246,201,107,.55);backdrop-filter:blur(6px);
  box-shadow:0 30px 80px rgba(0,0,0,.35)}
.card-title{font-family:var(--serif);font-size:60px;font-weight:900;color:var(--gold);letter-spacing:.12em;white-space:nowrap}
.card-title::before,.card-title::after{content:"";display:inline-block;width:44px;height:2px;background:var(--gold);vertical-align:middle;margin:0 16px;opacity:.8}
.card-body{font-size:58px;line-height:1.65;font-weight:500;margin-top:36px;letter-spacing:.04em}
.card-note{font-size:40px;line-height:1.6;margin-top:36px;color:var(--gold-2);opacity:.95;letter-spacing:.06em}

.mark{width:200px;height:200px;margin:0 auto}
.mark svg{width:100%;height:100%}
.c-org{font-family:var(--serif);font-size:92px;font-weight:900;letter-spacing:.12em;color:var(--gold-2);margin-top:40px;
  text-shadow:0 6px 30px rgba(0,0,0,.45)}
.c-line{font-size:60px;font-weight:500;letter-spacing:.14em;margin-top:34px}
.c-tag{font-size:40px;letter-spacing:.3em;opacity:.85;margin-top:40px;color:var(--gold)}

/* 進度與重播（截圖時隱藏） */
.ui{position:fixed;left:0;right:0;bottom:0;padding:14px 18px;display:flex;gap:14px;align-items:center;
  font:15px/1 var(--sans);color:#cbd3ea;background:linear-gradient(transparent,rgba(0,0,0,.55));z-index:9}
.ui .bar{flex:1;height:4px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
.ui .bar i{display:block;height:100%;width:0;background:var(--gold);animation:progress 30s linear both}
@keyframes progress{from{width:0}to{width:100%}}
.ui button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-size:15px}
.ui button:hover{background:rgba(255,255,255,.22)}
html.capture .ui{display:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div id="stars"></div>
  <div class="cloud c"></div><div class="cloud a"></div><div class="cloud b"></div>

  <div class="moon-wrap">
    <div class="halo"></div>
    <div class="moon">
      <div class="crater" style="left:70px;top:120px;width:44px;height:44px"></div>
      <div class="crater" style="left:300px;top:90px;width:30px;height:30px;opacity:.6"></div>
      <div class="crater" style="left:330px;top:300px;width:58px;height:58px;opacity:.5"></div>
      <div class="crater" style="left:120px;top:340px;width:26px;height:26px;opacity:.7"></div>
    </div>
    <svg class="rabbit" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="#a98a4d">
        <ellipse cx="52" cy="66" rx="30" ry="18"/>
        <circle cx="30" cy="52" r="14"/>
        <ellipse cx="24" cy="30" rx="5.5" ry="16" transform="rotate(-12 24 30)"/>
        <ellipse cx="36" cy="31" rx="5.5" ry="16" transform="rotate(10 36 31)"/>
        <circle cx="80" cy="60" r="7"/>
      </g>
    </svg>
  </div>

  <div id="petals"></div>
  <div id="lanterns"></div>

  <div class="land">
    <svg viewBox="0 0 1080 520" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3466"/><stop offset="1" stop-color="#231d43"/></linearGradient>
        <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241f45"/><stop offset="1" stop-color="#14112b"/></linearGradient>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151230"/><stop offset="1" stop-color="#0b0a1c"/></linearGradient>
      </defs>
      <path fill="url(#m1)" d="M0 260 C120 190 220 150 340 210 C440 260 520 180 640 200 C760 220 820 140 940 190 C1000 215 1040 240 1080 230 L1080 520 L0 520 Z"/>
      <path fill="url(#m2)" d="M0 340 C140 300 240 260 380 320 C520 380 600 300 760 330 C880 352 960 300 1080 330 L1080 520 L0 520 Z"/>
      <!-- 小屋（居家） -->
      <g transform="translate(700 300)">
        <path d="M0 62 L60 8 L120 62 Z" fill="#2d2450"/>
        <rect x="12" y="62" width="96" height="70" fill="#1c1738"/>
        <rect x="80" y="18" width="14" height="30" fill="#2d2450"/>
        <rect class="window" x="28" y="78" width="22" height="24" rx="3" fill="#ffd27a"/>
        <rect class="window" x="70" y="78" width="22" height="24" rx="3" fill="#ffd27a" style="animation-delay:-1.3s"/>
        <rect x="46" y="106" width="28" height="26" rx="3" fill="#ffb84d"/>
      </g>
      <!-- 樹 -->
      <g fill="#1a1636">
        <ellipse cx="620" cy="330" rx="34" ry="46"/><rect x="616" y="360" width="8" height="40"/>
        <ellipse cx="860" cy="345" rx="40" ry="52"/><rect x="856" y="380" width="8" height="40"/>
        <ellipse cx="200" cy="360" rx="46" ry="60"/><rect x="196" y="400" width="9" height="40"/>
      </g>
      <path fill="url(#g)" d="M0 400 C200 380 400 420 600 400 C800 380 950 410 1080 395 L1080 520 L0 520 Z"/>
    </svg>
  </div>

  <!-- 場景 1：標題 -->
  <section class="scene" style="--in:4s;--out:10.6s;top:1060px">
    <div class="h-title">中秋節快樂</div>
    <div class="rule"></div>
    <div class="h-org">臺北市私立燿翔居家長照機構</div>
  </section>

  <!-- 場景 2：主祝福 -->
  <section class="scene" style="--in:11.4s;--out:20.6s;top:1000px">
    <div class="big">花好月圓</div>
    <div class="sub">祝大家<br>中秋佳節愉快</div>
  </section>

  <!-- 場景 3：叮嚀／感謝／服務 -->
  <section class="scene" style="--in:21.4s;--out:26.6s;top:960px">
    <div class="card">
      <div class="card-title">居家照顧・專業陪伴</div>
      <div class="card-body">讓長輩在熟悉的家<br>安心過每一天</div>
      <div class="card-note">臺北市私立燿翔居家長照機構</div>
    </div>
  </section>

  <!-- 場景 4：結尾 -->
  <section class="scene" style="--in:27.2s;--out:35s;top:980px">
    <div class="mark">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="42" r="30" fill="#fff3cf"/>
        <path d="M22 70 L50 44 L78 70 L78 92 L22 92 Z" fill="#1c1738" stroke="#f6c96b" stroke-width="3" stroke-linejoin="round"/>
        <path d="M50 86 C50 78 40 76 40 69 C40 64 46 62 50 67 C54 62 60 64 60 69 C60 76 50 78 50 86 Z" fill="#e4573a"/>
      </svg>
    </div>
    <div class="c-org">燿翔居家長照機構</div>
    <div class="c-line">敬祝　平安團圓　中秋快樂</div>
    <div class="c-tag">月圓・人圓・心安圓</div>
  </section>
</div>

<div class="ui"><span>燿翔 中秋節慶賀（對外社群版）</span><div class="bar"><i></i></div><button onclick="location.reload()">重播</button></div>

<script>
(function(){
  var DUR = 30;
  // 隨機但固定的種子，讓每次載入畫面一致
  var seed = 20260926; function rnd(){ seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }

  var stars = document.getElementById('stars'), h='';
  for (var i=0;i<110;i++){
    var cls = rnd()<.3?'s':(rnd()<.2?'l':'');
    h += '<div class="star '+cls+'" style="left:'+(rnd()*1080).toFixed(0)+'px;top:'+(rnd()*1250).toFixed(0)+'px;animation-delay:-'+(rnd()*3.2).toFixed(2)+'s;animation-duration:'+(2.4+rnd()*2.4).toFixed(2)+'s"></div>';
  }
  stars.innerHTML = h;

  var lanternSvg = function(c1,c2){ return '<svg viewBox="0 0 110 170"><g class="sway">'+
    '<line x1="55" y1="0" x2="55" y2="18" stroke="#f6c96b" stroke-width="3"/>'+
    '<rect x="35" y="16" width="40" height="10" rx="3" fill="#f6c96b"/>'+
    '<ellipse cx="55" cy="76" rx="44" ry="52" fill="'+c1+'"/>'+
    '<ellipse cx="55" cy="76" rx="26" ry="52" fill="'+c2+'" opacity=".55"/>'+
    '<ellipse cx="55" cy="76" rx="10" ry="52" fill="#fff0b3" opacity=".5"/>'+
    '<rect x="35" y="124" width="40" height="10" rx="3" fill="#f6c96b"/>'+
    '<line x1="55" y1="134" x2="55" y2="150" stroke="#f6c96b" stroke-width="3"/>'+
    '<path d="M47 150 L63 150 L60 170 L50 170 Z" fill="#e4573a"/>'+
    '</g></svg>'; };
  var lan = document.getElementById('lanterns'), L='';
  var lanSpec = [[90,2,1.0],[880,4.5,.8],[500,8,.65],[220,12.5,.9],[760,15,.7],[400,19,.85]];
  lanSpec.forEach(function(s){
    var w = 110*s[2];
    L += '<div class="lantern" style="left:'+s[0]+'px;top:0;width:'+w+'px;height:'+(170*s[2])+'px;animation-delay:'+s[1]+'s;opacity:'+(0.55+s[2]*0.45)+'">'+lanternSvg('#e4573a','#ff8a5b')+'</div>';
  });
  lan.innerHTML = L;

  var pet = document.getElementById('petals'), P='';
  var flower = '<svg viewBox="0 0 26 26"><g fill="#f6c96b"><circle cx="13" cy="5" r="5"/><circle cx="21" cy="13" r="5"/><circle cx="13" cy="21" r="5"/><circle cx="5" cy="13" r="5"/></g><circle cx="13" cy="13" r="3" fill="#ffb84d"/></svg>';
  for (var j=0;j<26;j++){
    var d = 11 + rnd()*9, dl = rnd()*20, sz = 16 + rnd()*16;
    P += '<div class="petal" style="left:'+(rnd()*1080).toFixed(0)+'px;width:'+sz.toFixed(0)+'px;height:'+sz.toFixed(0)+'px;animation-duration:'+d.toFixed(2)+'s;animation-delay:'+dl.toFixed(2)+'s">'+flower+'</div>';
  }
  pet.innerHTML = P;

  function fit(){
    var s = Math.min(innerWidth/1080, innerHeight/1920);
    document.getElementById('stage').style.setProperty('--s', s.toFixed(4));
  }
  addEventListener('resize', fit); fit();

  // 截圖模式：所有動畫暫停，由外部以 __seek(秒) 定格到指定時間
  if (location.search.indexOf('capture') >= 0){
    document.documentElement.classList.add('capture');
    window.__seek = function(t){
      var ms = t*1000;
      document.getAnimations().forEach(function(a){ a.pause(); a.currentTime = ms; });
      return document.getAnimations().length;
    };
    window.__seek(0);
  }
})();
</script>
</body>
</html>
