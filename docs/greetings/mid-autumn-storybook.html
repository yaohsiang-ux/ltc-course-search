<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中秋立體故事書</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cover:#9b2a22; --cover-2:#6c1913; --gold:#e8b44c; --gold-2:#ffe3a3; --ink:#fff8e7; --edge:#fff5de;
  --paper-bg:linear-gradient(180deg,#f8eed6,#eedfba);
  --serif:'Noto Serif TC','WenQuanYi Zen Hei','PingFang TC','Microsoft JhengHei',serif;
  --sans:'Noto Sans TC','WenQuanYi Zen Hei','PingFang TC','Microsoft JhengHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050817;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:var(--sans);color:var(--ink)}
.stage{position:relative;width:1080px;height:1920px;overflow:hidden;flex:none;transform:scale(var(--s,1));
  background:radial-gradient(ellipse 820px 780px at 50% 56%,#3b2f63 0%,#1b2150 48%,#0a0f2e 100%)}
.star{position:absolute;border-radius:50%;background:#fff}
.glow{position:absolute;left:40px;top:640px;width:1000px;height:900px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,206,120,.26),rgba(255,206,120,0))}
.shadow{position:absolute;left:100px;top:1300px;width:880px;height:170px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0))}

/* 標題列 */
.head{position:absolute;top:110px;left:0;right:0;text-align:center}
.kicker{font-size:42px;letter-spacing:.32em;color:var(--gold);font-weight:500;height:60px}
.title{font-family:var(--serif);font-weight:900;font-size:116px;line-height:1.2;letter-spacing:.14em;color:var(--gold-2);margin-top:10px;
  text-shadow:0 6px 28px rgba(0,0,0,.5),0 0 36px rgba(255,210,120,.3);white-space:nowrap}

/* 3D 立體書 */
.viewport{position:absolute;inset:0;perspective:2300px;perspective-origin:540px 560px}
.book{position:absolute;left:60px;top:760px;width:960px;height:640px;transform-style:preserve-3d}
.board{position:absolute;left:480px;top:-14px;width:496px;height:668px;border-radius:4px 16px 16px 4px;
  background:linear-gradient(135deg,var(--cover),var(--cover-2));transform:translateZ(-5px)}
.page-r{position:absolute;left:480px;top:0;width:480px;height:640px;border-radius:0 10px 10px 0;
  background:linear-gradient(90deg,rgba(120,80,30,.3) 0,rgba(120,80,30,0) 70px),var(--paper-bg)}
.leaf,.cover{position:absolute;transform-style:preserve-3d;transform-origin:0 50%}
.leaf{left:480px;top:0;width:480px;height:640px;visibility:hidden}
.cover{left:480px;top:-14px;width:496px;height:668px}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.shade{position:absolute;inset:0;background:#1a0f05;opacity:0}
.leaf .face.front{border-radius:0 10px 10px 0;background:linear-gradient(90deg,rgba(120,80,30,.3) 0,rgba(120,80,30,0) 70px),var(--paper-bg)}
.leaf .face.back,.cover .paper{border-radius:10px 0 0 10px;background:linear-gradient(270deg,rgba(120,80,30,.3) 0,rgba(120,80,30,0) 70px),var(--paper-bg)}
.cover .face.front{border-radius:4px 16px 16px 4px;
  background:radial-gradient(circle at 70% 25%,rgba(255,220,150,.18),rgba(255,220,150,0) 55%),linear-gradient(135deg,#a82e25,#6c1913)}
.cover .face.back{border-radius:16px 4px 4px 16px;background:linear-gradient(135deg,var(--cover-2),var(--cover))}
.cover .paper{position:absolute;left:16px;right:0;top:14px;bottom:14px}
.cv-frame{position:absolute;inset:26px;border:3px solid var(--gold);border-radius:12px}
.cv-frame::after{content:"";position:absolute;inset:10px;border:1.5px solid rgba(232,180,76,.6);border-radius:8px}
.cv-moon{position:absolute;left:50%;top:72px;width:190px;height:190px;margin-left:-95px}
.cv-t1{position:absolute;left:0;right:0;top:270px;text-align:center;font-family:var(--serif);font-weight:900;font-size:150px;line-height:1;color:var(--gold-2);letter-spacing:.1em;text-shadow:0 4px 0 #5a130f}
.cv-t2{position:absolute;left:0;right:0;top:436px;text-align:center;font-family:var(--serif);font-weight:900;font-size:58px;color:var(--gold-2);letter-spacing:.2em}
.cv-sub{position:absolute;left:0;right:0;top:522px;text-align:center;font-size:24px;color:var(--gold);letter-spacing:.12em}
.cv-org{position:absolute;left:0;right:0;bottom:56px;text-align:center;font-size:26px;color:var(--gold-2);letter-spacing:.3em}

.spread{position:absolute;inset:0;transform-style:preserve-3d;visibility:hidden}
.pop{position:absolute;transform-origin:50% 100%;filter:drop-shadow(0 10px 8px rgba(0,0,0,.35))}
.pop svg{display:block;width:100%;height:100%;overflow:visible}

/* 旁白 */
.cap{position:absolute;left:56px;right:56px;top:1480px;height:330px;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:26px 44px;border-radius:36px;background:rgba(9,13,40,.66);border:2px solid rgba(232,180,76,.55);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.cap-t{font-size:60px;line-height:1.5;font-weight:500;letter-spacing:.04em}
.cap-t b{color:var(--gold-2);font-weight:700}
.foot{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:32px;letter-spacing:.3em;color:var(--gold);opacity:.8}
.petal2d{position:absolute;left:0;top:0;width:30px;height:30px}

/* 播放控制（截圖模式隱藏） */
.ui{position:fixed;left:0;right:0;bottom:0;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
  font:15px/1 var(--sans);color:#cbd3ea;background:linear-gradient(transparent,rgba(0,0,0,.65));z-index:9}
.ui button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:15px}
.ui button:hover{background:rgba(255,255,255,.24)}
.ui input{flex:1 1 100%;accent-color:#e8b44c}
.start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:10;font:700 22px/1.2 var(--sans);letter-spacing:.08em;
  padding:18px 32px;border-radius:999px;border:2px solid #e8b44c;background:rgba(12,18,48,.92);color:#ffe3a3;cursor:pointer;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.start:hover{background:rgba(40,40,90,.95)}
html.capture .start{display:none}
html.capture .ui{display:none}
</style>
</head>

    [28, 32.8, '王母娘娘感謝后羿，<br>賜給他一顆<b>長生不老的仙藥</b>。'],
    [33.2, 35.8, '下一個故事：<b>嫦娥奔月</b>'],
    [36, 40.8, '后羿把仙藥交給妻子<b>嫦娥</b>，<br>請她好好收藏。'],
    [41, 45.8, '壞人逄蒙趁后羿外出，<br>闖進家裡想搶奪仙藥。'],
    [46, 50.8, '情急之下，嫦娥吞下仙藥，<br>身子輕飄飄地飛上了天。'],
    [51, 55.8, '她飛到離人間最近的月亮，<br>住進<b>廣寒宮</b>，有玉兔陪伴。'],
    [56, 60.8, '后羿望月思妻，擺上鮮果月餅。<br>從此，八月十五<b>賞月團圓</b><br>的習俗流傳至今。'],
    [61.2, 63.8, '下一個故事：<b>吳剛伐桂</b>'],
    [64, 68.8, '月宮裡，<br>有一棵高達五百丈的<b>桂花樹</b>。'],
    [69, 73.8, '<b>吳剛</b>學仙不專心，<br>被罰到月宮砍倒這棵桂樹。'],
    [74, 78.8, '可是斧頭一砍下去，<br>樹上的傷口馬上又長了回來。'],
    [79, 83.8, '吳剛日復一日，<br>不停地砍呀砍……'],
    [84, 88.8, '每到中秋桂花飄香，<br>人們說，那是<br>從月宮飄下來的香氣。'],
    [89.2, 92.2, '故事說完了，<br>闔上故事書……'],
    [92.6, 100.5, '月圓人團圓<br>燿翔陪您　<b>安心過中秋</b>']
  ];
  var curHead = -1, curCap = -1;
  function seg(list, t){ for (var i=0;i<list.length;i++){ if (t >= list[i][0] && t < list[i][1]) return i; } return -1; }
  function fadeOf(item, t){ return P(t, item[0], item[0] + .45) * (1 - P(t, item[1] - .4, item[1])); }

  /* ---------- 立體書 ---------- */
  var STAND = 56;
  var SPREADS = [
    {el:$('spA'), rise:7.0, fold:32.9, pieces:[['aBack',0],['aMid',1],['aVillage',2],['aFront',3]]},
    {el:$('spB'), rise:35.6, fold:60.9, pieces:[['bBack',0],['bMid',1],['bHouse',2],['bChange',2],['bVillain',3],['bHouyi',-1]]},
    {el:$('spC'), rise:63.6, fold:88.9, pieces:[['cBack',0],['cGround',1],['cMain',2],['cRabbit',3]]}
  ];
  SPREADS.forEach(function(s){ s.pieces = s.pieces.map(function(p){ return {el:$(p[0]), id:p[0], i:p[1]}; }); });

  function popAngle(t, s, i, riseAt){
    var r0 = riseAt != null ? riseAt : s.rise + i*0.18;
    var r = ebk(P(t, r0, r0 + 1.0));
    var f = eio(P(t, s.fold, s.fold + 0.75));
    return STAND * r * (1 - f);
  }
  function setShade(face, v){ face.querySelector('.shade').style.opacity = v.toFixed(3); }
  function leafAngle(t, a, b){ return -180 * eio(P(t, a, b)); }

  var book = $('book'), cover = $('cover'), leaf1 = $('leaf1'), leaf2 = $('leaf2');
  var cvF = cover.children[0], cvB = cover.children[1];

  function render(rt){
    var t = pageT(rt);
    // 背景星星
    stageStars.forEach(function(s){ s.el.style.opacity = (.25 + .6*Math.abs(Math.sin(t*s.sp*.6 + s.ph))).toFixed(2); });

    // 書本姿態
    var o = eio(P(t, 5, 7)), c = eio(P(t, 90.2, 92.4)), intro = eout(P(t, 0, 1.6));
    var tilt = lerp(lerp(14, STAND, o), 18, c);
    var bx = lerp(lerp(-248, 0, o), -248, c);
    var by = lerp(260, 0, intro) + lerp(-110, 0, o) + lerp(0, -110, c) + Math.sin(t*.9)*5;
    book.style.transform = 'translate3d(' + bx.toFixed(1) + 'px,' + by.toFixed(1) + 'px,0) rotateX(' + tilt.toFixed(2) + 'deg)';
    $('shadow').style.opacity = (intro * (.55 + .45*o*(1-c))).toFixed(2);

    // 封面
    var cov = t < 90 ? -180*o : -180*(1 - c);
    cover.style.transform = 'translateZ(1px) rotateY(' + cov.toFixed(2) + 'deg)';
    setShade(cvF, .45*Math.abs(Math.sin(cov*Math.PI/180))); setShade(cvB, .45*Math.abs(Math.sin(cov*Math.PI/180)));

    // 翻頁
    [[leaf1, 34.0, 35.4, 2], [leaf2, 62.0, 63.4, 3]].forEach(function(L){
      var ang = leafAngle(t, L[1], L[2]);
      L[0].style.visibility = (t >= L[1] && t < 90) ? 'visible' : 'hidden';
      L[0].style.transform = 'translateZ(' + L[3] + 'px) rotateY(' + ang.toFixed(2) + 'deg)';
      var sh = .4*Math.abs(Math.sin(ang*Math.PI/180));
      setShade(L[0].children[0], sh); setShade(L[0].children[1], sh);
    });

    // 立體頁面
    SPREADS.forEach(function(s){
      var vis = t >= s.rise - .05 && t < s.fold + .9;
      s.el.style.visibility = vis ? 'visible' : 'hidden';
      if (!vis) return;
      s.pieces.forEach(function(p){
        var ang = p.id === 'bHouyi' ? popAngle(t, s, 0, 56.2) : popAngle(t, s, p.i);
        p.el.style.transform = 'translateZ(.6px) rotateX(' + (-ang).toFixed(2) + 'deg)' + (EXTRA[p.id] ? EXTRA[p.id](t) : '');
        if (p.id === 'bHouyi') p.el.style.visibility = t >= 56.2 ? 'inherit' : 'hidden';
      });
    });
    if (t >= 6.9 && t < 34) storyA(t);
    if (t >= 35.5 && t < 62) storyB(t);
    if (t >= 63.5 && t < 90) storyC(t);

    // 畫面桂花
    var pe = P(t, 84, 85.5) * (1 - P(t, 99.4, 100));
    petals2d.forEach(function(p){
      if (pe <= 0){ p.el.style.opacity = 0; return; }
      var y = ((t*p.sp + p.off) % 2000) - 40, x = p.x0 + Math.sin(t*.9 + p.ph)*p.amp;
      p.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + ((t*60 + p.ph*57) % 360).toFixed(0) + 'deg) scale(' + p.sc.toFixed(2) + ')';
      p.el.style.opacity = (pe * .9).toFixed(2);
    });

    // 標題與旁白
    var h = seg(HEAD, t);
    if (h !== curHead){ curHead = h; $('kicker').textContent = h >= 0 ? HEAD[h][2] : ''; $('title').textContent = h >= 0 ? HEAD[h][3] : ''; }
    $('head').style.opacity = h >= 0 ? fadeOf(HEAD[h], t).toFixed(3) : 0;
    var ci = seg(CAPS, t);
    if (ci !== curCap){ curCap = ci; $('capT').innerHTML = ci >= 0 ? CAPS[ci][2] : ''; }
    $('capT').style.opacity = ci >= 0 ? fadeOf(CAPS[ci], t).toFixed(3) : 0;
    $('cap').style.opacity = (P(t, .9, 1.5)).toFixed(3);
  }

  /* 各頁面的附加位移 */
  var EXTRA = {
    bChange: function(t){
      var a = eio(P(t, 46.4, 50.6));
      var tx = lerp(0, 215, a), ty = lerp(0, -470, a) + Math.sin(t*2)*4*(0.3 + a), sc = lerp(1, .42, a);
      return ' translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) scale(' + sc.toFixed(3) + ') rotate(' + (Math.sin(t*1.5)*1.5).toFixed(2) + 'deg)';
    },
    bVillain: function(t){
      var tx = lerp(320, 0, eout(P(t, 41.1, 42.3))) + lerp(0, 300, eio(P(t, 46.6, 47.8)));
      return ' translateX(' + tx.toFixed(1) + 'px)';
    }
  };

  function storyA(t){
    var O2 = O;
    SUNS.forEach(function(s){
      var dx = 0, dy = 0, sc = s.s*(1 + .05*Math.sin(t*6 + s.ph)), op = 1, rot = 0;
      if (s.shot){
        var hit = s.shot.t + .45, f = P(t, hit, hit + 1.3);
        if (t >= hit){ sc *= 1 + .3*(1 - P(t, hit, hit + .3)); }
        dx = f*30; dy = eio(f)*460; rot = f*120; op = 1 - P(t, hit + .5, hit + 1.3);
      }
      s.g.setAttribute('transform', 'translate(' + (s.x + dx).toFixed(1) + ' ' + (s.y + dy).toFixed(1) + ') scale(' + sc.toFixed(3) + ') rotate(' + rot.toFixed(1) + ')');
      s.g.setAttribute('opacity', op.toFixed(3));
      s.rays.setAttribute('transform', 'rotate(' + ((t*25 + s.ph*57) % 360).toFixed(1) + ')');
    });
    SHOTS.forEach(function(sh){
      var u = P(t, sh.t, sh.t + .45), S = SUNS[sh.sun];
      if (t < sh.t || t > sh.t + .45){ sh.g.setAttribute('opacity', 0); return; }
      var x = lerp(O2.x, S.x, u), y = lerp(O2.y, S.y, u), ang = Math.atan2(S.y - O2.y, S.x - O2.x)*180/Math.PI;
      sh.g.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + ang.toFixed(1) + ')');
      sh.g.setAttribute('opacity', 1);
    });
    $('aHot').setAttribute('opacity', (1 - P(t, 27.6, 29.2)).toFixed(3));
    $('aLush').setAttribute('opacity', P(t, 28, 29.8).toFixed(3));
    var joy = P(t, 28.2, 28.9);
    $('aJoy').setAttribute('opacity', joy.toFixed(3)); $('aSad').setAttribute('opacity', (1 - joy).toFixed(3));
    $('aJoy').setAttribute('transform', 'translate(0 ' + (-Math.abs(Math.sin(t*5))*8*joy).toFixed(1) + ')');

    // 拉弓
    var pull = eio(P(t, 19.2, 20.6)), snap = 1;
    SHOTS.forEach(function(sh){ var d = t - sh.t; if (d >= 0 && d < .42) snap = Math.min(snap, d < .06 ? 0 : eio((d - .06)/.36)); });
    pull *= snap; pull *= 1 - P(t, 27.9, 28.4);
    var sx = lerp(232.8, 184, pull), sy = lerp(124.3, 156, pull);
    $('aString').setAttribute('d', 'M181 44 L' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ' L284 204');
    var ax = .839, ay = -.544, L = 132, show = pull > .25 && t < 28;
    $('aNock').setAttribute('opacity', show ? 1 : 0);
    var ex = sx + ax*L, ey = sy + ay*L;
    $('aNockL').setAttribute('x1', sx.toFixed(1)); $('aNockL').setAttribute('y1', sy.toFixed(1));
    $('aNockL').setAttribute('x2', ex.toFixed(1)); $('aNockL').setAttribute('y2', ey.toFixed(1));
    $('aNockH').setAttribute('d', 'M' + (ex + ax*18).toFixed(1) + ' ' + (ey + ay*18).toFixed(1) + ' L' + (ex - ay*8).toFixed(1) + ' ' + (ey + ax*8).toFixed(1) + ' L' + (ex + ay*8).toFixed(1) + ' ' + (ey - ax*8).toFixed(1) + 'Z');

    // 仙藥
    var e = P(t, 28.4, 29.4);
    $('aElixir').setAttribute('opacity', e.toFixed(3));
    $('aElixir').setAttribute('transform', 'translate(96 ' + (40 + Math.sin(t*2)*6).toFixed(1) + ') scale(' + (.8 + .6*eout(e)).toFixed(3) + ')');
    $('aSpark').setAttribute('transform', 'rotate(' + ((t*40) % 360).toFixed(1) + ') scale(' + (1 + .12*Math.sin(t*4)).toFixed(3) + ')');
  }

  function storyB(t){
    bStars.forEach(function(s){ s.e.setAttribute('opacity', (.3 + .7*Math.abs(Math.sin(t*s.sp*.7 + s.ph))).toFixed(2)); });
    $('bHalo').setAttribute('r', (230 + Math.sin(t*1.6)*12).toFixed(1));
    var w = Math.sin(t*2.2)*6;
    $('ceRibL').setAttribute('transform', 'rotate(' + w.toFixed(2) + ' 88 96)');
    $('ceRibR').setAttribute('transform', 'rotate(' + (-w).toFixed(2) + ' 132 96)');
    $('cePill').setAttribute('opacity', ((1 - P(t, 46.1, 46.5)) * (.75 + .25*Math.sin(t*5))).toFixed(3));
    $('bVillain').style.opacity = (P(t, 41.1, 41.6) * (1 - P(t, 46.8, 47.8))).toFixed(3);
    var rb = P(t, 51.3, 52.2);
    $('bRabbit').setAttribute('opacity', rb.toFixed(3));
    $('bRabbit').setAttribute('transform', 'translate(515 ' + (292 - Math.abs(Math.sin(t*3.2))*10*rb).toFixed(1) + ')');
    $('bLant1').setAttribute('transform', 'translate(92 164) rotate(' + (Math.sin(t*1.8)*6).toFixed(2) + ')');
    $('bLant2').setAttribute('transform', 'translate(248 164) rotate(' + (Math.sin(t*1.8 + 1)*6).toFixed(2) + ')');
    $('bSmoke').setAttribute('transform', 'translate(' + (Math.sin(t*1.3)*3).toFixed(1) + ' 0)');
  }

  function storyC(t){
    cStars.forEach(function(s){ s.e.setAttribute('opacity', (.3 + .7*Math.abs(Math.sin(t*s.sp*.7 + s.ph))).toFixed(2)); });
    $('cWugang').setAttribute('opacity', P(t, 69, 69.8).toFixed(3));
    var start = 69.8, per = 1.6, ang = 0, dtHit = 99;
    if (t >= start){
      var u = ((t - start) % per) / per;
      if (u < .55) ang = lerp(0, 110, eio(u/.55));
      else if (u < .7) ang = lerp(110, -4, ein((u - .55)/.15));
      else ang = lerp(-4, 0, eout((u - .7)/.3));
      var n = Math.floor((t - start - .7*per) / per);
      if (t >= start + .7*per) dtHit = t - (start + n*per + .7*per);
    }
    $('cArm').setAttribute('transform', 'rotate(' + ang.toFixed(2) + ' 552 380)');
    var notch = dtHit < .15 ? 1 : 1 - P(dtHit, .3, 1.1);
    $('cNotch').setAttribute('opacity', notch.toFixed(3));
    $('cHeal').setAttribute('opacity', (dtHit < 1.2 ? Math.sin(Math.PI*P(dtHit, .3, 1.1)) : 0).toFixed(3));
    chips.forEach(function(c){
      if (dtHit > .55){ c.e.setAttribute('opacity', 0); return; }
      var x = 410 + c.vx*dtHit, y = 438 + c.vy*dtHit + 300*dtHit*dtHit;
      c.e.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + (dtHit*400).toFixed(0) + ')');
      c.e.setAttribute('opacity', (1 - dtHit/.55).toFixed(3));
    });
    petals.forEach(function(p){
      var y = 150 + ((t*p.sp + p.off) % 380), x = p.x0 + Math.sin(t*1.3 + p.ph)*p.amp;
      p.e.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + ((t*70 + p.ph*57) % 360).toFixed(0) + ')');
      p.e.setAttribute('opacity', (1 - P(y, 470, 530)).toFixed(3));
    });
    $('cPestle').setAttribute('transform', 'translate(0 ' + (-Math.abs(Math.sin(t*3.4))*16).toFixed(1) + ')');
  }

  /* ---------- 縮放與播放 ---------- */
  function fit(){ var s = Math.min(innerWidth/1080, innerHeight/1920); $('stage').style.setProperty('--s', s.toFixed(4)); }
  addEventListener('resize', fit); fit();

  if (location.search.indexOf('capture') >= 0){
    document.documentElement.classList.add('capture');
    window.__seek = function(t){ render(t); return 1; };
    render(0);
  } else {
var nar = $('nar'), seek = $('seek'), paused = true, cur = 0, start = 0, lastFix = 0;
    seek.max = D.toFixed(1);
    function nowS(){ return performance.now()/1000; }
    function jump(r){ cur = Math.max(0, Math.min(r, D)); start = nowS() - cur; try { nar.currentTime = cur; } catch (e) {} render(cur); seek.value = cur.toFixed(1); }
    function play(){ paused = false; $('startBtn').style.display = 'none'; start = nowS() - cur; try { nar.currentTime = cur; } catch (e) {} var pr = nar.play(); if (pr && pr.catch) pr.catch(function(){}); $('bPlay').textContent = '暫停'; }
    function pause(){ paused = true; nar.pause(); $('bPlay').textContent = '播放'; }
    function loop(){
      if (!paused){
        cur = nowS() - start;
        var nt = nowS();
        if (!nar.paused && !nar.ended && cur < D && Math.abs(nar.currentTime - cur) > .35 && nt - lastFix > 1){ lastFix = nt; try { nar.currentTime = cur; } catch (e) {} }
        if (cur > D + 2){ jump(0); play(); }
        render(Math.min(cur, D)); seek.value = Math.min(cur, D).toFixed(1);
      }
      requestAnimationFrame(loop);
    }
    render(0); requestAnimationFrame(loop);
    $('startBtn').onclick = function(){ jump(0); play(); };
    $('bPlay').onclick = function(){ if (paused) play(); else pause(); };
    Array.prototype.forEach.call(document.querySelectorAll('.ui [data-t]'), function(b){ b.onclick = function(){ jump(realT(parseFloat(b.dataset.t))); play(); }; });
    seek.oninput = function(){ jump(parseFloat(seek.value)); if (!paused) play(); };
  }
})();
</script>
